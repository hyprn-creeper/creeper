# /etc/creeper.conf — настройки creeper
# потоки сборки (ноутбук греется до 95 °C — 4 потока заметно прохладнее, чем 8)
CREEPER_JOBS=4
# 1 = вырезать отладочную информацию из программ (меньше места)
CREEPER_STRIP=1
# 1 = всегда запускать тесты пакетов
CREEPER_CHECK=0
# репозиторий готовых бинарников (ферма на GitHub)
BINREPO="https://github.com/hyprn-creeper/creeper/releases/download/bin"
# 1 = хранить собранные пакеты в /var/cache/creeper/bin (переустановка за секунды)
CREEPER_KEEPBIN=1
# предупреждать, если свободного места меньше (МБ)
CREEPER_MINFREE_MB=3000
