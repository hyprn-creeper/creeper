# /etc/creeper.conf — настройки creeper
# потоки сборки (ноутбук греется — можно поставить -j4)
MAKEFLAGS="-j$(nproc)"
# 1 = вырезать отладочную информацию из программ (меньше места)
CREEPER_STRIP=1
# 1 = всегда запускать тесты пакетов
CREEPER_CHECK=0
# репозиторий готовых бинарников (появится, когда настроим GitHub)
BINREPO="https://github.com/hyprn-creeper/creeper/releases/download/bin"
# 1 = сохранять собранные пакеты в /var/cache/creeper/bin (переустановка за секунды)
CREEPER_KEEPBIN=1
