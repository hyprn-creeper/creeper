# Зонд: скачивает программу и показывает, какие библиотеки ей нужны.
# Ничего не публикует. Запуск: gh workflow run probe.yml -f what=discord
name: probe
run-name: "probe: ${{ inputs.what || 'регистрация' }}"

on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
    inputs:
      what:
        description: "discord | kernel | urls | lfs-discord | blfs:раздел/страница,... | ls:URL,URL | sh:base64"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      WHAT: ${{ inputs.what }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Discord
        if: env.WHAT == 'discord'
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          cd /tmp
          curl -fsSL -o discord.tar.gz -w 'URL: %{url_effective}\n' 'https://discord.com/api/download?platform=linux&format=tar.gz'
          tar -xzf discord.tar.gz
          ls -la Discord; file Discord/*
          echo "== postinst.sh"; cat Discord/postinst.sh
          echo "== discord.desktop"; cat Discord/discord.desktop
          [ -f Discord/discord ] && ! file -b Discord/discord | grep -q ELF && { echo "== discord (скрипт)"; cat Discord/discord; }
          echo "== строки загрузчика"; strings -n 8 Discord/updater_bootstrap | grep -iE 'https?://|\.config|XDG|HOME|discord_|--' | sort -u | head -n 60
          echo "== пробный запуск загрузчика (90 с, виртуальный экран)"
          export HOME=/tmp/h XDG_CONFIG_HOME=/tmp/h/.config; mkdir -p $HOME
          ( cd Discord && timeout 90 xvfb-run -a ./discord --no-sandbox ) > /tmp/run.log 2>&1 || true
          grep -iE 'error|cannot open|not found|fail' /tmp/run.log | grep -v dbus | head -n 25
          echo "== что скачалось"; find $HOME/.config/discord -maxdepth 2 | head -n 40
          app=$(find $HOME/.config/discord -mindepth 2 -type f -name 'Discord' -perm -u+x 2>/dev/null | head -n1)
          [ -z "$app" ] && app=$(find $HOME -type f -perm -u+x -size +50M 2>/dev/null | head -n1)
          echo "== приложение: $app"
          if [ -n "$app" ]; then
            d=$(dirname "$app")
            echo "== NEEDED приложения"
            find "$d" -type f -exec sh -c 'file -b "$1" | grep -q ELF && readelf -d "$1" 2>/dev/null | sed -n "s/.*Shared library: \[\(.*\)\]/\1/p"' _ {} \; | sort -u
            echo "== свои .so"; find "$d" -maxdepth 2 -name '*.so*' -printf '%f\n' | sort
            echo "== Electron"; strings "$app" | grep -m3 -E '^Electron/|Chrome/[0-9]+\.' || true
            echo "== dlopen"; strings "$app" | grep -E '^lib[a-z0-9_+-]+\.so(\.[0-9]+)*$' | sort -u | head -n 80
          fi

      - name: Kernel
        if: env.WHAT == 'kernel'
        run: |
          curl -fsSL https://www.kernel.org/releases.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('latest_stable', d['latest_stable']['version']); [print(r['moniker'], r['version']) for r in d['releases'][:8]]"
          curl -fsSL https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/PKGBUILD | grep -E '^(pkgver|pkgrel)='
          for f in config config.x86_64; do curl -fsSL -o /tmp/config "https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/raw/main/$f" && { echo "конфиг Arch: $f"; break; }; done
          curl -fsSL "https://gitlab.archlinux.org/api/v4/projects/archlinux%2Fpackaging%2Fpackages%2Flinux/repository/tree?ref=main" | python3 -c "import json,sys; print([x['name'] for x in json.load(sys.stdin)])"
          head -n 4 /tmp/config; grep -E 'CONFIG_(MODULE_COMPRESS|MODULE_SIG|DEBUG_INFO|RTW88_8821CE|BLK_DEV_NVME|EXT4_FS|DRM_I915)[ =]' /tmp/config

      - name: BLFS
        if: startsWith(env.WHAT, 'blfs:')
        run: |
          cat > /tmp/blfs.py << 'PY'
          import html, re, sys, urllib.request
          for page in sys.argv[1].split(","):
              url = "https://www.linuxfromscratch.org/blfs/view/12.4/%s.html" % page.strip()
              try:
                  t = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "replace")
              except Exception as e:
                  print("#### %s: %s" % (page, e)); continue
              print("#### " + page)
              for h in sorted(set(re.findall(r'href="([^"]+\.(?:tar\.(?:xz|gz|bz2|zst)|tgz|patch))"', t))):
                  print("URL", h)
              m = re.search(r"(Required|Recommended)", t)
              for kind in ("Required", "Recommended"):
                  mm = re.search(r'<h4[^>]*>\s*%s\s*</h4>(.*?)</p>' % kind, t, re.S)
                  if mm:
                      print("%s: %s" % (kind, re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", "", mm.group(1)))).strip()))
              for cls, cmd in re.findall(r'<pre class="(userinput|root)">(.*?)</pre>', t, re.S):
                  c = html.unescape(re.sub(r"<[^>]+>", "", cmd)).strip()
                  print(("[root] " if cls == "root" else "") + c)
                  print("--")
          PY
          python3 /tmp/blfs.py "${WHAT#blfs:}"

      - uses: actions/checkout@v5
        if: env.WHAT == 'urls'
      - name: Проверка ссылок всех рецептов
        if: env.WHAT == 'urls'
        run: |
          bad=0
          for r in recipes/*/recipe; do
            while read -r s; do
              [ -n "$s" ] || continue
              u=${s#*::}
              code=$(curl -sL -o /dev/null -r 0-0 -w '%{http_code}' --connect-timeout 20 --max-time 60 "$u")
              case $code in 200|206) ;; *) echo "ПЛОХО $code ${r%/recipe} $u"; bad=$((bad+1));; esac
            done < <(bash -c '. "$1" >/dev/null 2>&1; printf "%s\n" "${source[@]}"' _ "$r")
          done
          echo "плохих ссылок: $bad"

      - uses: actions/checkout@v5
        if: env.WHAT == 'lfs-discord'
      - name: Discord внутри копии LFS
        if: env.WHAT == 'lfs-discord'
        run: |
          R=/lfs
          gh release download base -p 'lfs-builder.tar.zst' -D /tmp
          sudo mkdir -p $R && zstd -dc /tmp/lfs-builder.tar.zst | sudo tar -C $R -xpf -
          sudo install -m755 creeper $R/usr/bin/creeper
          sudo rm -rf $R/var/lib/creeper/recipes; sudo mkdir -p $R/var/lib/creeper; sudo cp -r recipes $R/var/lib/creeper/recipes
          printf 'BINREPO="https://github.com/%s/releases/download/bin"\n' "$GITHUB_REPOSITORY" | sudo tee $R/etc/creeper.conf
          sudo cp -L /etc/resolv.conf $R/etc/resolv.conf
          for m in dev dev/pts proc sys; do :; done
          sudo mount --bind /dev $R/dev; sudo mount -t devpts devpts $R/dev/pts; sudo mount -t proc proc $R/proc; sudo mount -t sysfs sysfs $R/sys; sudo mount -t tmpfs tmpfs $R/run
          sudo chroot $R /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c 'creeper install discord' 2>&1 | grep -E '==>|xx>|!!>' | grep -v 'Ссссс'
          echo "== загрузчик внутри LFS"
          sudo chroot $R /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c \
            'mkdir -p /root/.config/discord && /usr/share/discord/updater_bootstrap --no-zenity /root/.config/discord stable https://updates.discord.com/' 2>&1 | tail -n 5
          echo "== недостающие библиотеки (ldd)"
          sudo chroot $R /usr/bin/env -i PATH=/usr/bin:/usr/sbin /bin/bash -c \
            'cd /root/.config/discord/app-*/ && for f in Discord *.so* $(find . -name "*.node"); do [ -f "$f" ] && ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|$f: |"; done | sort -u'
          echo "== запуск Discord --version"
          sudo chroot $R /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c 'cd /root/.config/discord/app-*/ && timeout 30 ./Discord --version --no-sandbox' 2>&1 | tail -n 15
          for m in run sys proc dev/pts dev; do sudo umount $R/$m || true; done

      - name: Список файлов по ссылке
        if: startsWith(env.WHAT, 'ls:')
        run: |
          for u in $(echo "${WHAT#ls:}" | tr ',' ' '); do
            echo "== $u"
            curl -fsSL "$u" | grep -oE 'href="[^"?]+"' | sed 's/^href="//; s/"$//' | sort -uV | tail -n 25
          done

      - name: Команда
        if: startsWith(env.WHAT, 'sh:')
        run: |
          cd /tmp && echo "${WHAT#sh:}" | base64 -d > cmd.sh && bash cmd.sh 2>&1 | tail -n 400
